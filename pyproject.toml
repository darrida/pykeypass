[project]
name = "pykeypass"
version = "2025.04.26"
description = ""
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.8",
    "lxml>=5.4.0",
    "pykeepass>=4.1.1.post1",
    "setuptools>=79.0.1",
    "wheel>=0.45.1",
]

[project.scripts]
pykeypass = "main:cli"

[tool.ruff]
line-length = 120
extend-exclude = [".venv"]
extend-select = ["S", "I", "C4"]  # bandit (S), isort (I), comprehensions (C4), type-checking (TCH)
fixable = ["F401", "I001"]

[tool.ruff.isort]
extra-standard-library = []
known-first-party = []
known-local-folder = []

[build-system]
requires = ["setuptools", "wheel"]  # Default tools for building Python projects
build-backend = "setuptools.build_meta"  # Default build backend

[tool.uv]
package = true